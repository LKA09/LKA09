name: Daily profile refresh

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Refresh contribution graph
        continue-on-error: true
        run: python scripts/generate_streak_svg.py LKA09 contrib-heatmap.svg

      - name: Stamp daily README refresh
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import re

          path = Path("README.md")
          content = path.read_text(encoding="utf-8")
          stamp = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
          replacement = "<!-- PROFILE_SYNC_START -->" + stamp + "<!-- PROFILE_SYNC_END -->"
          content, count = re.subn(
              r"<!-- PROFILE_SYNC_START -->.*?<!-- PROFILE_SYNC_END -->",
              replacement,
              content,
              count=1,
          )
          if count != 1:
              raise SystemExit("README sync marker not found")
          path.write_text(content, encoding="utf-8")
          PY

      - name: Commit daily refresh
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(profile): daily refresh [skip ci]"
          file_pattern: "README.md contrib-heatmap.svg"
